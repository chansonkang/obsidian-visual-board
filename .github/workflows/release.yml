name: Publish plugin release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Bind release to this repository
        run: node scripts/configure-repository.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Validate and package release
        run: node scripts/release-package.mjs "$GITHUB_REF_NAME"
      - name: Extract this version's release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME"
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/main.js release/manifest.json release/styles.css \
            release/LUCIDE-LICENSE.txt release/PDFJS-LICENSE.txt \
            release/MARKDOWN-IT-LICENSE.txt release/TURNDOWN-LICENSE.txt \
            release/TURNDOWN-GFM-LICENSE.txt \
            "release/Visual-Board-v${GITHUB_REF_NAME}-Chanson.zip" release/SHA256SUMS.txt \
            --verify-tag --title "Visual Board $GITHUB_REF_NAME" \
            --notes-file release/RELEASE-NOTES.md --latest
